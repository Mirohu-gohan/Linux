version: '3.7'

services:
  mysql:
    build: ./mysql
    container_name: mysql_container
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/initialize.sql:/docker-entrypoint-initdb.d/initialize.sql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'p@ssword'
      MYSQL_DATABASE: 'test_db'
      MYSQL_USER: 'data_user'
      MYSQL_PASSWORD: 'data'

  phpmyadmin:
    depends_on:
      - mysql
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
    restart: always
    ports:
      - "8081:80"

  php-apache:
    build: ./php
    volumes:
      - ./htdocs:/var/www/html
    restart: always
    ports:
      - "80:80"
    depends_on:
      - mysql
      - memcached # ★ PHPコンテナがMemcachedにも依存するように追加

  websocket-server:
    build:
      context: .
      dockerfile: Dockerfile.websocket-server
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    restart: always

  openssh-server:
    image: linuxserver/openssh-server:version-9.6_p1-r0
    container_name: openssh-server
    hostname: openssh-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Tokyo
      - PASSWORD_ACCESS=true 
      - USER_PASSWORD=ps       
      - USER_NAME=miwa        
    ports:
      - "2222:2222"
    restart: unless-stopped

  # ★ ここを修正しました！
  memcached:
    image: memcached:latest
    container_name: memcached_cache 
    ports:
      - "11211:11211"
    restart: always

volumes:
  db_data: {}