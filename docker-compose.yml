version: '3.7'

services:
  mysql:
    build: ./mysql
    container_name: mysql_container
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/initialize.sql:/docker-entrypoint-initdb.d/initialize.sql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'p@ssword'
      MYSQL_DATABASE: 'test_db'
      MYSQL_USER: 'data_user'
      MYSQL_PASSWORD: 'data'

  phpmyadmin:
    depends_on:
      - mysql
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
    restart: always
    ports:
      - "8081:80" # ★ 8080 から 8081 に変更して重複を回避

  php-apache:
    build: ./php
    volumes:
      - ./htdocs:/var/www/html
    restart: always
    ports:
      - "80:80"
    depends_on:
      - mysql

  websocket-server:
    build:
      context: .
      dockerfile: Dockerfile.websocket-server
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    restart: always # ★ networksの行を削除（自動的に全員と同じネットワークに繋がります）

  openssh-server:
    image: linuxserver/openssh-server:version-9.6_p1-r0
    container_name: openssh-server
    hostname: openssh-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Tokyo
      - PASSWORD_ACCESS=true 
      - USER_PASSWORD=ps       
      - USER_NAME=miwa        
    ports:
      - "2222:2222"
    restart: unless-stopped

volumes:
  db_data: {}